name: Update catalog from podcast feed
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Commit if the catalog changed
        run: |
          git config user.name "edventures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes.json
          git diff --cached --quiet || (git commit -m "Update catalog from feed" && git push)
